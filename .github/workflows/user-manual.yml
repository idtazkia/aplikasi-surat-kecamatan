name: user-manual

on:
  push:
    branches: [main]
    paths:
      - "docs/user-manual/**"
      - "web/e2e/manual/**"
      - "web/playwright.manual.config.ts"
      - ".github/workflows/user-manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-user-manual
  cancel-in-progress: false

jobs:
  capture-screenshots:
    name: Capture Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.22.1

      - name: Install web deps
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: cd web && npx playwright test --config=playwright.manual.config.ts

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-manual-screenshots
          path: docs/user-manual/src/screenshots/

  build:
    name: Build mdBook
    needs: capture-screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: user-manual-screenshots
          path: docs/user-manual/src/screenshots/

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Build mdBook
        run: mdbook build docs/user-manual

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/user-manual/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
