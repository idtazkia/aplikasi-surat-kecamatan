name: concept-catalog

on:
  push:
    branches: [main]
    paths:
      - "docs/concepts/**"
      - "internal/**"
      - "db/**"
      - "tools/concept-links/**"
      - ".github/workflows/concepts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # untuk concept-links resolve commit SHA

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Inject permalinks ke concept pages
        run: go run ./tools/concept-links inject

      - name: Emit concept-links.json
        run: |
          mkdir -p web/public
          go run ./tools/concept-links emit-json web/public/concept-links.json

      - name: Build mdBook
        run: mdbook build docs/concepts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/concepts/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
