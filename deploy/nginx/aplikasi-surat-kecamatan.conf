# Nginx site config untuk aplikasi-surat-kecamatan.
# Path: /etc/nginx/sites-available/aplikasi-surat-kecamatan.conf
# Symlink: /etc/nginx/sites-enabled/aplikasi-surat-kecamatan.conf
#
# Setup TLS dulu via acme.sh sebelum apply config ini (lihat deploy/scripts/setup-tls.sh).

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name surat.example.com;

    # ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surat.example.com;

    # TLS config (issued via acme.sh -> ~/.acme.sh/, install ke /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/surat.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/surat.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options                "DENY" always;
    add_header X-Content-Type-Options         "nosniff" always;
    add_header Referrer-Policy                "strict-origin-when-cross-origin" always;

    # Frontend static (Vue PWA build output)
    root /var/www/aplikasi-surat-kecamatan;
    index index.html;

    client_max_body_size 25m; # PDF + lampiran

    # API → Go backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    # Service worker — must NOT cached by browser, supaya update on next online visit works
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Static assets dengan hash di filename → cache aggresive
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/aplikasi-surat.access.log;
    error_log  /var/log/nginx/aplikasi-surat.error.log;
}
