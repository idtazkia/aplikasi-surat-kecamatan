---
# Full provisioning untuk satu tenant. Idempotent — boleh re-run.
#
# Asumsi host sudah punya: nginx, postgresql server cluster, certbot (kalau tls_enabled).
# Asumsi laptop pre-build: `make build` dan `make web-build` di repo root sebelum run.

- name: Provision Surat Kecamatan tenant
  hosts: surat
  become: true

  pre_tasks:
    - name: Validate required vars
      ansible.builtin.import_role:
        name: validate

  roles:
    - host-bootstrap
    - tenant-user
    - postgres-tenant
    - surat-app
    - surat-frontend
    - nginx-vhost
    - role: surat-tls
      when: tls_enabled | bool
    - role: surat-backup
      when: backup_enabled | bool

  post_tasks:
    - name: Smoke test backend health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/healthz"
        status_code: 200
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

    - name: Smoke test public domain
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/healthz"
        status_code: 200
        validate_certs: true
      when: tls_enabled | bool

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - ""
          - "=== TENANT PROVISIONED ==="
          - "Tenant ID:      {{ tenant_id }}"
          - "Public URL:     {{ 'https' if tls_enabled else 'http' }}://{{ app_domain }}"
          - "Backend:        127.0.0.1:{{ app_port }} (systemd: surat-{{ tenant_id }}.service)"
          - "App user:       {{ app_user }}"
          - "App dir:        {{ app_dir }}"
          - "Database:       {{ db_name }}@{{ db_host }}:{{ db_port }} (user {{ db_user }})"
          - "Backup:         {{ 'enabled (' + backup_rclone_remote + ')' if backup_enabled else 'disabled' }}"
          - ""
          - "Next steps:"
          - "  - Buat admin user pertama (registrasi via /api/auth/register, lalu grant role admin via SQL)"
          - "  - Pantau: journalctl -u surat-{{ tenant_id }}.service -f"
