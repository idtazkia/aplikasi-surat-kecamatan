---
# Build dist/ di laptop, sync ke tenant docroot, render config.json runtime.

- name: Build frontend dist di laptop
  ansible.builtin.command:
    cmd: make web-build
    chdir: "{{ playbook_dir }}/../.."
  delegate_to: localhost
  become: false
  changed_when: true

- name: Verify dist artifact ada
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../web/dist/index.html"
  delegate_to: localhost
  become: false
  register: dist_index

- name: Fail kalau dist/ tidak ter-build
  ansible.builtin.fail:
    msg: "web/dist/index.html tidak ada setelah make web-build"
  when: not dist_index.stat.exists

- name: Clear stale dist artifacts (preserve config.json)
  ansible.builtin.shell:
    cmd: |
      find {{ app_dir }}/web -mindepth 1 -maxdepth 1 ! -name 'config.json' -exec rm -rf {} +
    executable: /bin/bash
  changed_when: true

- name: Sync dist ke tenant web/
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../web/dist/"
    dest: "{{ app_dir }}/web/"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Render runtime config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ app_dir }}/web/config.json"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
