[book]
title = "Panduan Pengguna — Aplikasi Surat Kecamatan"
authors = ["STMIK Tazkia"]
language = "id"
multilingual = false
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/idtazkia/aplikasi-surat-kecamatan"
edit-url-template = "https://github.com/idtazkia/aplikasi-surat-kecamatan/edit/main/docs/user-manual/{path}"
site-url = "/aplikasi-surat-kecamatan/manual/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
